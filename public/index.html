<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALMERA • Presentasi Rencana Bisnis KIK (SMK Negeri 2 Sragen)</title>
  <link rel="stylesheet" href="/css/presenter.css?v=4">
  <link rel="icon" type="image/png" href="/img/Almera.png">
</head>

<body>
  <div class="presentation-viewport">
    <div class="slide-canvas" id="slide-canvas">
      <!-- Safe Area Slide Stage -->
      <div class="slide-stage">

        <!-- HUD Top Right: Stopwatch & Actions -->
        <div class="hud-top-right">
          <div class="timer-pill" id="timer-pill" title="Stopwatch Durasi (Target: 5 - 10 Menit)">
            <div class="timer-dot"></div>
            <span class="timer-text" id="timer-display">00:00</span>
          </div>

          <button class="hud-btn" id="btn-qr-modal" title="Pairing Smartphone Remote (Tekan 'Q')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Remote</span>
          </button>

          <button class="hud-btn" id="btn-fullscreen" title="Mode Layar Penuh (Tekan 'F')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
              </path>
            </svg>
            <span>Fullscreen</span>
          </button>
        </div>

        <!-- Slide Dynamic Container -->
        <div class="slide-wrapper" id="slide-wrapper">
          <!-- Di-render dinamis oleh presenter.js -->
        </div>

        <!-- HUD Bottom: Progress Bar & Status -->
        <div class="hud-slide-counter" id="slide-counter">01 / 13</div>
        <div class="remote-status-badge" id="remote-status-btn">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Menunggu Remote HP...</span>
        </div>
        <div class="hud-bottom-bar">
          <div class="hud-progress-fill" id="progress-fill"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- QR Code Pairing Modal -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="modal-card">
      <button class="modal-close-btn" id="btn-close-modal">&times;</button>
      <h3 class="modal-title">Pairing Remote Smartphone</h3>
      <p class="modal-sub">Pindai QR Code berikut menggunakan kamera HP untuk mengendalikan slide secara nirkabel:</p>
      <div class="qr-image-box">
        <img id="qr-img" src="" alt="Pairing QR Code">
      </div>
      <div class="remote-url-display" id="remote-url-text">Memuat tautan pairing...</div>
    </div>
  </div>

  <!-- Overview Mode: Grid Peta Semua Slide -->
  <div class="overview-overlay" id="overview-overlay" role="dialog" aria-modal="true" aria-label="Peta semua slide">
    <div class="overview-header">
      <span class="overview-title">Peta Slide</span>
      <span class="overview-hint">
        <kbd>O</kbd> atau <kbd>Esc</kbd> tutup · klik slide untuk loncat · <kbd>←</kbd><kbd>→</kbd> geser
      </span>
    </div>
    <div class="overview-grid" id="overview-grid"></div>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js" onerror="this.remove()"></script>
  <script src="/js/qrcode.min.js"></script>
  <script src="/js/peerjs.min.js"></script>
  <script src="/js/slides-data.js"></script>
  <script src="/js/presenter.js"></script>
</body>

</html>
